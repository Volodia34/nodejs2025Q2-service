version: '3.8'

services:
  postgres-db:
    image: postgres:16-alpine
    container_name: my-postgres-db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - db-data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT}:5432"
    networks:
      - my-app-network

  nestjs-app:
    build: .
    container_name: my-nestjs-app
    restart: on-failure
    ports:
      - "${PORT}:4000"
    environment:
      POSTGRES_HOST: postgres-db
      POSTGRES_PORT: ${POSTGRES_PORT}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - ./src:/usr/src/app/src
    depends_on:
      - postgres-db
    networks:
      - my-app-network

networks:
  my-app-network:
    driver: bridge

volumes:
  db-data:
